# ── Test profile: self-contained, no MySQL/Redis required ────────────
spring.datasource.url=jdbc:h2:mem:lumoo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

encryption.key=dGVzdC1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZTE=
app.encryption.key=${encryption.key}
resend.api.key=dummy-test-key
modempay.api-key=
app.base-url=http://localhost:8080
# RateLimitFilter has its own unit test; keep it out of the way of MockMvc tests
rate.limit.enabled=false
