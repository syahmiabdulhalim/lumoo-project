# ── Prod profile: Docker / production overrides ─────────
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true

# Redis cache — Redis service must be running
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.redis.time-to-live=300000

# Larger connection pool for prod
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ── Environment variable mapping ───────────────────────
# Explicit so prod never depends on an untracked application.properties.
app.encryption.key=${ENCRYPTION_KEY:}
encryption.key=${ENCRYPTION_KEY:}
app.base-url=${APP_BASE_URL:https://lumoo.my}
app.upload.dir=${UPLOAD_DIR:/app/uploads/products}
resend.api.key=${RESEND_API_KEY:}
modempay.api-key=${MODEMPAY_API_KEY:}
modempay.webhook-secret=${MODEMPAY_WEBHOOK_SECRET:}

# ── Schema migrations (Flyway) ─────────────────────────
# Existing prod DB has no flyway_schema_history: baseline it at V1 (V1 is not executed), then apply V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Behind Caddy: trust X-Forwarded-For only from private-network proxies (Tomcat RemoteIpValve)
server.forward-headers-strategy=native
